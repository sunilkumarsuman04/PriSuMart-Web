<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>PriSuMart — Fresh Groceries Delivered Fast</title>
    <meta
      name="description"
      content="PriSuMart is now live! Order fresh fruits, vegetables, dairy, snacks and household essentials with fast doorstep delivery. Download the app today on Google Play."
    />
    <meta name="keywords" content="PriSuMart, PriSuMart app, Google Play, grocery delivery, online grocery, fast delivery, fresh groceries, instant delivery app, quick commerce, grocery app India" />
    <meta name="author" content="PriSuMart" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.prisumart.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2E8B3D" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.prisumart.com/" />
    <meta property="og:title" content="PriSuMart — Fresh Groceries Delivered Fast" />
    <meta
      property="og:description"
      content="PriSuMart is now live on Google Play. Fresh fruits, vegetables, dairy & daily essentials delivered fast — Fresh Items, Happy Homes."
    />
    <meta property="og:image" content="https://www.prisumart.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PriSuMart — Fresh Groceries Delivered Fast. Now on Google Play." />
    <meta property="og:site_name" content="PriSuMart" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PriSuMart — Fresh Groceries Delivered Fast" />
    <meta
      name="twitter:description"
      content="PriSuMart is now live! Fresh groceries delivered fast — download the app today on Google Play."
    />
    <meta name="twitter:image" content="https://www.prisumart.com/og-image.png" />
    <meta name="twitter:image:alt" content="PriSuMart — Fresh Groceries Delivered Fast. Now on Google Play." />

    <!-- Fonts: Sora (display) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PriSuMart",
        "url": "https://www.prisumart.com",
        "logo": "https://www.prisumart.com/apple-touch-icon.png",
        "description": "PriSuMart is a grocery delivery platform offering fresh fruits, vegetables, dairy, snacks and household essentials with fast doorstep delivery.",
        "sameAs": []
      }
    </script>

    <!-- Structured Data: MobileApplication (Play Store URL is filled from src/config/app.config.ts at build time) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "PriSuMart",
        "operatingSystem": "ANDROID",
        "applicationCategory": "ShoppingApplication",
        "url": "__PLAY_STORE_URL__",
        "downloadUrl": "__PLAY_STORE_URL__",
        "installUrl": "__PLAY_STORE_URL__",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:system-ui,sans-serif;text-align:center">
        PriSuMart is now live! Enable JavaScript to view this site, or
        <a href="__PLAY_STORE_URL__">download the app on Google Play</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
